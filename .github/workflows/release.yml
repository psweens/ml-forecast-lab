name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without leading v, e.g. 2.30.0)'
        required: true
        type: string

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Always release from main for the branch / dispatch paths so
          # the released artefact matches what users see on the default
          # branch. The tag-push path checks out the tag itself.
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'main' }}

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              VERSION="${{ inputs.version }}"
              ;;
            push)
              if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                VERSION="${GITHUB_REF#refs/tags/v}"
              elif [[ "${GITHUB_REF}" == refs/heads/release/v* ]]; then
                VERSION="${GITHUB_REF#refs/heads/release/v}"
              else
                echo "Unexpected push ref: ${GITHUB_REF}" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unexpected event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Verify config.yaml version matches
        run: |
          set -euo pipefail
          CONFIG_VERSION=$(grep '^version:' ml-forecast-lab/config.yaml | awk '{print $2}')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$CONFIG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: config.yaml version ($CONFIG_VERSION) does not match release (v$TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          # Prefer the CHANGELOG section — same source of truth as the
          # tag-push path, and works for branch / dispatch where no tag
          # annotation exists yet.
          awk -v hdr="## $VERSION" '
            BEGIN { flag = 0 }
            $0 == hdr { flag = 1; next }
            /^## / && flag { exit }
            flag { print }
          ' ml-forecast-lab/CHANGELOG.md > RELEASE_NOTES.md
          # Fallback to tag annotation if CHANGELOG section is empty
          # (e.g. legacy tag-push without a CHANGELOG entry).
          if [ ! -s RELEASE_NOTES.md ] && [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            git tag -l --format='%(contents)' "v$VERSION" > RELEASE_NOTES.md
          fi
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release v$VERSION" > RELEASE_NOTES.md
          fi
          echo "--- RELEASE NOTES ---"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          # For the tag-push path this is ignored (tag already exists).
          # For the branch / dispatch paths, point the new tag at the
          # main commit we checked out above.
          target_commitish: main
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'rc') || contains(steps.version.outputs.version, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up release trigger branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Deleting trigger branch $BRANCH"
          git push origin --delete "$BRANCH"
