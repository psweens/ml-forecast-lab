name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke tests (fast UI/API gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install smoke deps
        run: |
          python -m pip install --upgrade pip
          # Smoke tests only need the web stack + data plumbing — not the
          # ML backends. Keeps this job under 30s wall time.
          pip install \
            fastapi \
            httpx \
            python-multipart \
            "Jinja2>=3.1,<4.0" \
            "pandas>=2.0,<3.0" \
            "numpy>=1.24,<2.0" \
            "PyYAML>=6.0,<7.0" \
            "aiohttp>=3.8,<4.0" \
            "pydantic>=2.0,<3.0" \
            "pytest>=8.0,<9.0"

      - name: Run smoke tests
        working-directory: ml-forecast-lab
        run: python -m pytest tests/smoke/ -v --tb=short

  unit:
    name: Unit tests (full deps)
    runs-on: ubuntu-latest
    # Some unit tests have known drift (test_config defaults, holiday detection,
    # mean-rank scoring) and a few need ML backends installed. Phase 6 will
    # clean these up; until then this job runs but doesn't gate.
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install full deps
        working-directory: ml-forecast-lab
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-dev.txt

      - name: Run unit tests
        working-directory: ml-forecast-lab
        run: python -m pytest tests/unit/ -v --tb=short
