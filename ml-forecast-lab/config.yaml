---
name: ML Forecast Lab
version: 2.0.4
slug: ml_forecast_lab
description: Multi-model ML forecasting and benchmarking for Home Assistant
url: https://github.com/psweens/ml-forecast-lab
startup: services
boot: auto
arch:
  - aarch64
  - amd64
  - armv7
init: false
homeassistant_api: true
hassio_api: true
hassio_role: admin
auth_api: true
ingress: true
ingress_port: 5052
panel_icon: mdi:chart-timeline-variant-shimmer
panel_title: ML Forecast Lab
webui: http://[HOST]:[PORT:5052]
ports:
  5052/tcp: 5052
ports_description:
  5052/tcp: ML Forecast Lab Web UI
map:
  - addon_config:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
  - ssl:rw
options:
  log_level: info
  models: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|critical)?
  models:
    - name: str
      model_type: str
