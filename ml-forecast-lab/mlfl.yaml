# ============================================================================
# ML Forecast Lab — Example Configuration
# ============================================================================
# Place this file at /addon_configs/ml_forecast_lab/mlfl.yaml on your HA
# instance (the canonical add-on config directory). The legacy
# /config/mlfl.yaml path is still read as a fallback.
#
# Two operational modes per experiment:
#   mode: lab        → trains ALL enabled models, benchmarks with CV, shows
#                      results in the web UI. No forecasts published to HA.
#   mode: production → trains only the promoted model on full history,
#                      publishes forecasts to HA every cycle.
#
# Typical workflow:
#   1. Start in lab mode, run benchmarks, inspect results via the add-on's
#      "Open Web UI" button (Home Assistant ingress — direct port 5052 was
#      removed in v2.30.0, all access is now through HA's authenticated proxy).
#   2. Pick the winning model (or let auto-select choose by metric).
#   3. Switch to production mode — forecasts appear as HA sensor entities.
# ============================================================================

# --- Global settings --------------------------------------------------------
timezone: "Europe/London"
update_every_minutes: 360          # minutes between train/forecast cycles

# --- Experiments ------------------------------------------------------------
# Each experiment predicts one target sensor. You can define as many as you
# like — they run sequentially each cycle.

experiments:

  # ==========================================================================
  # Experiment 1: Mixergy hot water demand (% charge consumed per interval)
  # ==========================================================================
  - name: "mixergy_demand"
    target_entity: "sensor.mixergy_demand_today"
    mode: "lab"                    # start in lab mode to find the best model

    # -- Source characteristics -----------------------------------------------
    source_is_cumulative: true     # sensor reports a running total for "today"
    reset_daily: true              # counter resets at local midnight
    interval_minutes: 30           # resample to 30-min buckets
    max_increment: 40              # cap abnormal 30-min jumps (% points)

    # -- Training window ------------------------------------------------------
    days_history: 60               # use last 60 days for training
    max_age: 365                   # keep up to 1 year in the SQLite cache

    # -- Forecast window ------------------------------------------------------
    future_periods: 96             # 48 h at 30-min cadence

    # -- Covariates -----------------------------------------------------------
    covariates:
      - entity: "sensor.current_charge"
        role: "lagged"             # only historical values available
        aggregation: "mean"
        scale: 0.01                # 0–100 % → 0–1 for model input

      - entity: "sensor.external_temperature"
        role: "lagged"
        aggregation: "mean"

      # Uncomment when you have a holiday binary sensor:
      # - entity: "sensor.holiday_mode"
      #   role: "lagged"
      #   is_binary: true

    # -- Models to benchmark --------------------------------------------------
    models_enabled:
      - "lightgbm"
      - "xgboost"
      - "lstm"
      - "cnn"
      # - "dlinear"                 # Decomposition-Linear (Zeng et al., 2023)
      # - "nbeats"                  # Neural Basis Expansion (Oreshkin et al., 2020)
      # - "nhits"                   # Neural Hierarchical Interpolation (Challu et al., 2023)
      # - "tide"                    # Time-series Dense Encoder (Das et al., 2023)
      # - "tsmixer"                 # Time-Series Mixer (Chen et al., 2023)
      # - "sparsetsf"              # Sparse Time-Series Forecasting (Lin et al., 2024)
      # - "patchtst"               # Patch Time-Series Transformer (Nie et al., 2023)
      # - "itransformer"           # Inverted Transformer (Liu et al., 2024)
      # - "crossformer"            # Cross-variable Transformer (Zhang & Yan, 2023)
      # - "timesnet"               # TimesNet 2D vision backbone (Wu et al., 2023)

    # -- Neural model settings ------------------------------------------------
    loss_fn: "mse"                   # Training loss for neural models: "mse", "mae", "huber"

    # -- Cross-validation settings --------------------------------------------
    cv_strategy: "walk_forward"    # or "sliding_window"
    cv_folds: 5
    cv_embargo_periods: 2          # 2 × 30 min = 1 h gap between train/test

    # -- Evaluation metrics ---------------------------------------------------
    metrics:
      - "mae"
      - "rmse"
      - "mape"
      - "smape"
      - "mase"
    production_metric: "rmse"      # metric used to rank models / auto-select

    # -- Custom metrics (Python expressions) ----------------------------------
    # Variables available: y_true, y_pred, np
    custom_metrics:
      peak_hour_mae: >
        float(np.mean(np.abs(y_true - y_pred)))

    # -- Production settings (used when mode: production) ---------------------
    production_model: null          # null = auto-select best from last benchmark
    publish_prefix: "mlfl_"
    publish_name: "mixergy_demand"
    units: "%"
    output_units: "%"
    country: "GB"
    log_transform: false
    database: true

  # ==========================================================================
  # Experiment 2: Mixergy heat energy (kWh consumed per interval)
  # ==========================================================================
