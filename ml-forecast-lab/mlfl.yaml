# ============================================================================
# ML Forecast Lab — Example Configuration
# ============================================================================
# Place this file at /addon_configs/ml_forecast_lab/mlfl.yaml on your HA
# instance (the canonical add-on config directory). The legacy
# /config/mlfl.yaml path is still read as a fallback.
#
# Two operational modes per experiment:
#   mode: lab        → trains ALL enabled models, benchmarks with CV, shows
#                      results in the web UI. No forecasts published to HA.
#   mode: production → trains only the promoted model on full history,
#                      publishes forecasts to HA every cycle.
#
# Typical workflow:
#   1. Start in lab mode, run benchmarks, inspect results via the add-on's
#      "Open Web UI" button (Home Assistant ingress — direct port 5052 was
#      removed in v2.30.0, all access is now through HA's authenticated proxy).
#   2. Pick the winning model (or let auto-select choose by metric).
#   3. Switch to production mode — forecasts appear as HA sensor entities.
#
# The values below are placeholders. Replace `target_entity` and the
# covariate entities with sensors that exist in your own Home Assistant
# install. You can also create experiments from the web UI without ever
# touching this file.
# ============================================================================

# --- Global settings --------------------------------------------------------
timezone: "UTC"                    # set to your local IANA timezone
update_every_minutes: 360          # minutes between train/forecast cycles

# --- Experiments ------------------------------------------------------------
# Each experiment predicts one target sensor. You can define as many as you
# like — they run sequentially each cycle.

experiments:

  # ==========================================================================
  # Example: forecast household electrical load (instantaneous power, W)
  # ==========================================================================
  # Replace `sensor.power_consumption_w` with whichever sensor in your HA
  # install you want to forecast. Defaults assume a non-cumulative, signed
  # numeric sensor; see DOCS.md for cumulative / daily-reset / energy targets.
  - name: "household_load"
    target_entity: "sensor.power_consumption_w"
    mode: "lab"                    # start in lab mode to find the best model

    # -- Source characteristics -----------------------------------------------
    source_is_cumulative: false    # set true if the sensor reports a running total
    interval_minutes: 30           # resample to 30-min buckets

    # -- Training window ------------------------------------------------------
    days_history: 30               # use last 30 days for training
    max_age: 365                   # keep up to 1 year in the SQLite cache

    # -- Forecast window ------------------------------------------------------
    future_periods: 48             # 24 h at 30-min cadence

    # -- Covariates -----------------------------------------------------------
    # Optional external signals. Comment out or remove if you don't have them.
    covariates:
      - entity: "sensor.outside_temperature"
        role: "lagged"             # historical values only
        aggregation: "mean"

      # Future weather forecast from a Met.no / Solcast / forecast.solar
      # entity. Uncomment and adjust if you have one wired in:
      # - entity: "weather.home"
      #   role: "future"
      #   future_attribute: "forecast"
      #   future_value_key: "temperature"
      #   aggregation: "mean"

    # -- Models to benchmark --------------------------------------------------
    # Always include `seasonal_naive` as a baseline. The starter set below
    # is the "Fast" preset; switch to "Balanced" or "Thorough" once you have
    # confirmed the basics work. See docs/MODEL_GUIDE.md for guidance.
    models_enabled:
      - "seasonal_naive"
      - "lightgbm"
      - "xgboost"
      - "lstm"
      - "cnn"
      # - "dlinear"                 # Decomposition-Linear (Zeng et al., 2023)
      # - "nbeats"                  # Neural Basis Expansion (Oreshkin et al., 2020)
      # - "nhits"                   # Neural Hierarchical Interpolation (Challu et al., 2023)
      # - "tide"                    # Time-series Dense Encoder (Das et al., 2023)
      # - "tsmixer"                 # Time-Series Mixer (Chen et al., 2023)
      # - "sparsetsf"               # Sparse Time-Series Forecasting (Lin et al., 2024)
      # - "segrnn"                  # Segment Recurrent Neural Network (Lin et al., 2023)
      # - "xpatch"                  # Exponential-decomposition dual-stream (Stitsyuk & Choi, 2025)
      # - "cyclenet"                # Residual Cycle Forecasting (Lin et al., 2024)
      # - "patchtst"                # Patch Time-Series Transformer (Nie et al., 2023)
      # - "itransformer"            # Inverted Transformer (Liu et al., 2024)
      # - "crossformer"             # Cross-variable Transformer (Zhang & Yan, 2023)
      # - "timesnet"                # TimesNet 2D vision backbone (Wu et al., 2023)

    # -- Neural model settings ------------------------------------------------
    loss_fn: "huber"                 # "mse" / "mae" / "huber" — huber is a good default

    # -- Cross-validation settings --------------------------------------------
    cv_strategy: "walk_forward"    # or "sliding_window"
    cv_folds: 5
    cv_embargo_periods: 2          # 2 × 30 min = 1 h gap between train/test

    # -- Evaluation metrics ---------------------------------------------------
    metrics:
      - "mae"
      - "rmse"
      - "mape"
      - "smape"
      - "mase"
      - "seasonal_mase"
    production_metric: "seasonal_mase"  # metric used to rank models / auto-select

    # -- Production settings (used when mode: production) ---------------------
    production_model: null          # null = auto-select best from last benchmark
    publish_prefix: "mlfl_"
    publish_name: "household_load"
    units: "W"
    country: ""                     # ISO-2 country code (GB, US, DE, …) for holidays; empty = no holiday feature
    log_transform: false
