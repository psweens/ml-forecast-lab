<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ML Forecast Lab{% endblock %}</title>
    <link rel="stylesheet" href="{{ base_path | default('') }}/static/style.css">
    <script src="{{ base_path | default('') }}/static/htmx.min.js"></script>
    {% block head_scripts %}{% endblock %}
    <script>var BASE_PATH = "{{ base_path | default('') }}";</script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <span class="brand-logo">📈</span>
                <span class="brand-text">ML Forecast Lab</span>
            </div>
            <button class="hamburger" onclick="this.classList.toggle('open');document.getElementById('nav-menu').classList.toggle('nav-open');" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="navbar-menu" id="nav-menu">
                <li><a href="{{ base_path | default('') }}/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a></li>
                <li><a href="{{ base_path | default('') }}/models" class="nav-link {% if active_page == 'models' %}active{% endif %}">Models</a></li>
                <li><a href="{{ base_path | default('') }}/training" class="nav-link {% if active_page == 'training' %}active{% endif %}">Training</a></li>
                <li><a href="{{ base_path | default('') }}/log" class="nav-link {% if active_page == 'logs' %}active{% endif %}">Logs</a></li>
                <li><a href="{{ base_path | default('') }}/system" class="nav-link {% if active_page == 'system' %}active{% endif %}">System</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>ML Forecast Lab · Created by <a href="https://github.com/psweens" target="_blank" style="color: var(--accent-secondary); text-decoration: none;">Dr Paul W. Sweeney</a></p>
    </footer>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Confirm modal -->
    <div id="confirm-modal" class="modal-overlay" style="display:none;">
        <div class="modal-dialog">
            <p id="confirm-modal-message"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="mlfl._confirmReject()">Cancel</button>
                <button class="btn btn-primary" onclick="mlfl._confirmAccept()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // Utility functions
        window.mlfl = {
            pollInterval: 5000,
            maxPolls: 120,

            pollBenchmarkStatus: function(experimentName) {
                let pollCount = 0;
                const pollId = setInterval(function() {
                    fetch(`${BASE_PATH}/experiment/${experimentName}/results`)
                        .then(response => {
                            if (!response.ok) return;
                            return response.json();
                        })
                        .then(data => {
                            if (data && data.status === 'completed') {
                                location.reload();
                                clearInterval(pollId);
                            } else if (data && data.status === 'failed') {
                                mlfl.toast('Benchmark failed: ' + (data.error_message || 'Unknown error'), 'error');
                                clearInterval(pollId);
                            }
                            pollCount++;
                            if (pollCount > window.mlfl.maxPolls) clearInterval(pollId);
                        })
                        .catch(err => {
                            console.error('Poll error:', err);
                            pollCount++;
                            if (pollCount > window.mlfl.maxPolls) clearInterval(pollId);
                        });
                }, window.mlfl.pollInterval);
            },

            // Toast notification system
            toast: function(message, level) {
                level = level || 'info';
                var container = document.getElementById('toast-container');
                var el = document.createElement('div');
                el.className = 'toast toast-' + level;
                el.textContent = message;
                container.appendChild(el);
                // Trigger animation
                requestAnimationFrame(function() { el.classList.add('toast-visible'); });
                setTimeout(function() {
                    el.classList.remove('toast-visible');
                    setTimeout(function() { el.remove(); }, 300);
                }, 4000);
            },

            // Styled confirm dialog
            _confirmCallback: null,
            confirm: function(message, onConfirm) {
                document.getElementById('confirm-modal-message').textContent = message;
                document.getElementById('confirm-modal').style.display = 'flex';
                mlfl._confirmCallback = onConfirm;
            },
            _confirmAccept: function() {
                document.getElementById('confirm-modal').style.display = 'none';
                if (mlfl._confirmCallback) mlfl._confirmCallback();
                mlfl._confirmCallback = null;
            },
            _confirmReject: function() {
                document.getElementById('confirm-modal').style.display = 'none';
                mlfl._confirmCallback = null;
            }
        };
    </script>

    <script>
    // Position tooltips near the ? icon using fixed positioning
    document.querySelectorAll('.info-tip').forEach(function(tip) {
        tip.addEventListener('mouseenter', function(e) {
            var text = tip.querySelector('.tip-text');
            if (!text) return;
            var rect = tip.getBoundingClientRect();
            text.style.left = Math.min(rect.left, window.innerWidth - 340) + 'px';
            text.style.top = (rect.top - text.offsetHeight - 8) + 'px';
            // If it would go above viewport, show below instead
            if (rect.top - text.offsetHeight - 8 < 0) {
                text.style.top = (rect.bottom + 8) + 'px';
            }
        });
    });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
