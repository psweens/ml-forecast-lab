{% extends "base.html" %}

{% block title %}Logs - ML Forecast Lab{% endblock %}

{% block content %}
<section class="dashboard-header">
    <h1>Application Logs</h1>
    <p class="subtitle">Recent log output from ML Forecast Lab</p>
    <div class="action-buttons">
        <a href="{{ base_path | default('') }}/debug_log" class="btn btn-secondary" download>
            ⬇ Download Full Log
        </a>
        <span id="live-indicator" style="display: inline-flex; align-items: center; gap: 0.4rem; color: var(--success); font-size: 0.85rem;">
            <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite;"></span>
            Live
        </span>
    </div>
</section>

<section class="section">
    <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;">
        <button class="btn btn-secondary log-filter active" data-level="all" onclick="filterLogs('all', this)">All</button>
        <button class="btn btn-secondary log-filter" data-level="INFO" onclick="filterLogs('INFO', this)">Info</button>
        <button class="btn btn-secondary log-filter" data-level="WARNING" onclick="filterLogs('WARNING', this)">Warnings</button>
        <button class="btn btn-secondary log-filter" data-level="ERROR" onclick="filterLogs('ERROR', this)">Errors</button>
    </div>
    <pre id="log-output" style="background: var(--bg-primary); border: 1px solid var(--border); border-radius: 0.5rem;
        padding: 1rem; overflow-x: auto; max-height: 70vh; overflow-y: auto; font-family: 'Courier New', monospace;
        font-size: 0.8rem; line-height: 1.5; color: var(--text-primary); white-space: pre-wrap; word-wrap: break-word;">{{ log_content }}</pre>
</section>

<style>
    .log-filter.active { background: var(--accent-secondary); color: var(--bg-primary); }
    #log-output .log-error { color: #e74c3c; font-weight: 600; }
    #log-output .log-warning { color: #f39c12; }
    #log-output .log-separator { color: #00d4ff; opacity: 0.8; }
    #log-output .log-result { color: #2ecc71; }
    #log-output .log-star { color: #f39c12; font-weight: 600; }
    #log-output .log-benchmark { color: #00d4ff; font-weight: 600; }
    #log-output .log-stats { color: #b0b0b0; }
    #log-output .log-model { color: #9b59b6; }
    #log-output .log-timestamp { color: #5a6a7a; }
    #log-output .log-production { color: #2ecc71; font-weight: 600; }
</style>
{% endblock %}

{% block scripts %}
<script>
    // Scroll to bottom of log
    var logEl = document.getElementById('log-output');
    logEl.scrollTop = logEl.scrollHeight;

    // Colorize log lines
    function colorize(text) {
        var lines = text.split('\n');
        return lines.map(function(line) {
            // Errors and warnings first (highest priority)
            if (line.includes('ERROR')) return '<span class="log-error">' + line + '</span>';
            if (line.includes('WARNING')) return '<span class="log-warning">' + line + '</span>';
            // Section separators and headers
            if (/[═╔╚─]{3,}/.test(line)) return '<span class="log-separator">' + line + '</span>';
            if (/BENCHMARK:|PRODUCTION:/.test(line)) return '<span class="log-benchmark">' + line + '</span>';
            // Results
            if (line.includes('★') || line.includes('Best model:')) return '<span class="log-star">' + line + '</span>';
            if (line.includes('✓')) return '<span class="log-result">' + line + '</span>';
            // Model benchmarking lines
            if (/\[\d+\/\d+\] Benchmarking:/.test(line)) return '<span class="log-model">' + line + '</span>';
            // Data stats
            if (/Target stats:|Data range:|Preprocessed:|Fetched \d+/.test(line)) return '<span class="log-stats">' + line + '</span>';
            // Production forecast
            if (/Production inference complete|forecast points|Published/.test(line)) return '<span class="log-production">' + line + '</span>';
            // Dim the timestamp prefix
            return line.replace(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}[\d,]* \w+\s*)/, '<span class="log-timestamp">$1</span>');
        }).join('\n');
    }
    logEl.innerHTML = colorize(logEl.textContent);

    // Filter state
    var allLines = logEl.textContent.split('\n');
    var currentFilter = 'all';
    var autoScroll = true;
    var lastLineCount = allLines.length;

    // Detect if user scrolled up (disable auto-scroll)
    logEl.addEventListener('scroll', function() {
        var atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 50;
        autoScroll = atBottom;
    });

    function filterLogs(level, btn) {
        document.querySelectorAll('.log-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = level;
        applyFilter();
    }

    function applyFilter() {
        var filtered = allLines;
        if (currentFilter !== 'all') {
            filtered = allLines.filter(function(l) {
                return l.toUpperCase().includes(' ' + currentFilter + ' ');
            });
        }
        logEl.innerHTML = colorize(filtered.join('\n'));
        if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
    }

    // Auto-refresh: poll for new log lines every 3 seconds
    var lastContent = allLines.join('\n');
    var liveIndicator = document.getElementById('live-indicator');
    var liveDot = liveIndicator ? liveIndicator.querySelector('span') : null;

    function setLiveStatus(ok) {
        if (!liveIndicator || !liveDot) return;
        var colour = ok ? 'var(--success)' : 'var(--error)';
        liveIndicator.style.color = colour;
        liveDot.style.background = colour;
        liveDot.style.animation = ok ? 'pulse 2s infinite' : 'none';
    }

    setInterval(function() {
        fetch(BASE_PATH + '/api/log?lines=500')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                setLiveStatus(true);
                if (data.lines) {
                    var newContent = data.lines.join('\n');
                    if (newContent !== lastContent) {
                        allLines = data.lines;
                        lastContent = newContent;
                        applyFilter();
                    }
                }
            })
            .catch(function(err) {
                console.error('Log poll error:', err);
                setLiveStatus(false);
            });
    }, 3000);
</script>
{% endblock %}
